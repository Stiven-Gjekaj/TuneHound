[project]
name = "tunehound"
version = "1.1.1"
description = "Download music from many providers with yt-dlp."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Stiven Gjekaj", email = "stivenagostingjekaj@gmail.com" }]
dependencies = [
    "yt-dlp>=2025.1.1",
    "mutagen>=1.47.0",
]

[project.scripts]
tunehound = "tunehound.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
